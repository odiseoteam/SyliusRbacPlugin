# Gates each dashboard widget's first render behind the permission its own numbers belong to,
# through PermissionGatedHookableRenderer. Only `configuration` is added here -- component, props
# and template stay whatever Sylius declares them as, so an upgrade never has to be reconciled
# with this file. `channel_selector` is left alone on purpose: see LIVE_COMPONENT_EXCLUDED.
#
# The "pending actions" widget (orders to process, shipments to ship...) does not exist before
# Sylius 2.1, so gating it lives in config/app/twig_hooks_sylius_2_1/admin/dashboard.yaml,
# loaded only where that widget does.
sylius_twig_hooks:
    hooks:
        'sylius_admin.dashboard.index.content':
            statistics:
                configuration:
                    permission: sylius.statistics.view

        'sylius_admin.dashboard.index.content.latest_statistics':
            new_orders:
                configuration:
                    permission: sylius.order.index
