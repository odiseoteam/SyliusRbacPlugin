# Replaces the Sylius Plus placeholder in the `roles` section of the administrator form with our
# own card, under its own key rather than reusing `roles`: an application may have already
# disabled that placeholder itself, and `enabled: false` on someone else's key wins over us
# redeclaring it. The nested `sections.roles` hook below is unaffected -- its prefix comes from
# the parent hookable, not from this key's name.
sylius_twig_hooks:
    hooks:
        'sylius_admin.admin_user.create.content.form.sections#left':
            roles:
                enabled: false
            administration_roles:
                template: '@OdiseoSyliusRbacPlugin/admin/user/roles.html.twig'
                priority: -100

        'sylius_admin.admin_user.update.content.form.sections#left':
            roles:
                enabled: false
            administration_roles:
                template: '@OdiseoSyliusRbacPlugin/admin/user/roles.html.twig'
                priority: -100

        'sylius_admin.admin_user.create.content.form.sections.roles':
            administration_roles:
                template: '@OdiseoSyliusRbacPlugin/admin/user/roles/administration_roles.html.twig'
                priority: 0

        'sylius_admin.admin_user.update.content.form.sections.roles':
            administration_roles:
                template: '@OdiseoSyliusRbacPlugin/admin/user/roles/administration_roles.html.twig'
                priority: 0
