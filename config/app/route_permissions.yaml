# The admin routes Sylius does not cover on its own.
#
# Admin routes in a stock install already declare `permission: true`, and the
# resource controller turns that into a `{package}.{subject}.{operation}` code by itself. The
# entries below are the remainder, split into two kinds:
#
#   * routes that enforce nothing today and are given a permission here;
#   * routes that declare `permission: true` but whose controller cannot be mapped to a resource
#     action, so nothing would ever be checked.
#
# Applications and plugins extend this list with their own routes.
odiseo_sylius_rbac:
    route_permissions:
        # --- Routes with no `permission: true` declared ---------------
        
        # Signs the administrator in as another user. Filed under Customer in the tree --
        # see SUBJECT_PARENTS -- since that's the screen the button sits on; the group here
        # would be overridden anyway.
        sylius_admin_impersonate_user:
            permission: sylius.impersonation.execute

        # Just a redirect to the create screen; Sylius excludes taxon's `index` on purpose.
        sylius_admin_taxon_index:
            permission: sylius.taxon.index
            group: catalog

        sylius_admin_admin_user_remove_avatar:
            permission: sylius.admin_user.update
            group: administration

        # Own operation, not `update`: resending a confirmation isn't editing the order.
        sylius_admin_order_resend_confirmation_email:
            permission: sylius.order.resend_confirmation_email
            group: sales

        sylius_admin_shipment_resend_confirmation_email:
            permission: sylius.shipment.resend_confirmation_email
            group: sales

        # --- Declare `permission: true`, but nothing ever checks it ----------------------

        # An invokable controller, so the resource controller's check never runs.
        sylius_admin_catalog_promotion_delete:
            permission: sylius.catalog_promotion.delete
            group: marketing

        # `generateAction` never checks permission, and a batch isn't the same as one coupon by hand.
        sylius_admin_promotion_coupon_generate:
            permission: sylius.promotion_coupon.generate
            group: marketing

        sylius_admin_customer_orders_statistics:
            permission: sylius.customer.show
            group: customers

        # Plain controller, nothing derives a permission, and no resource owns whole-shop numbers.
        sylius_api_admin_statistics:
            permission: sylius.statistics.view
            group: dashboard

        # --- API operations whose own shape names the wrong thing ------------------------

        # DELETE /admin/customers/{id}/user removes the shop user account, not the customer.
        # The admin screen gates the same button with `sylius.shop_user.delete`.
        sylius_api_admin_customer_delete:
            permission: sylius.shop_user.delete

        # The API counterpart of `sylius_admin_customer_orders_statistics`, and granted by the
        # same permission: one administrator should not be able to read per-customer figures on
        # one surface and not the other.
        sylius_api_admin_customer_get_statistics:
            permission: sylius.customer.show

        # Adding an image is declared on the parent resource, so the last segment of
        # `/admin/products/{code}/images` is a noun and not the name of an action -- the reading
        # ApiOperationPermissionResolver would otherwise give it. The admin adds images from the
        # product form, so it is the same permission as editing the product.
        sylius_api_admin_product_product_image_post:
            permission: sylius.product.update

        sylius_api_admin_taxon_taxon_image_post:
            permission: sylius.taxon.update

        # --- Third-party plugins bundled with sylius-standard (adyen, mollie, paypal, refund) --
        #
        # None of these follow the `{vendor}.controller.{subject}` convention closely enough for
        # RoutePermissionResolver to resolve them on its own: either the route never declares
        # `permission: true`, the controller is invokable with no action name to read an
        # operation from, or (mollie_subscription's transitions) the service id carries an extra
        # segment RoutePermissionResolver does not expect. Confirmed against a real
        # sylius-standard install, `odiseo:rbac:debug` scenario -- see ALPHA_VERIFICATION.md.

        # "adyen_order_payment", not "order_payment": the tree's row label drops the vendor
        # prefix, keeping only the subject segment, so a plain "order_payment" here would render
        # identically to Mollie's own row below -- two rows, both labelled "Order payment", with
        # no way to tell which is which.
        sylius_adyen_admin_order_payment_generate_pay_link:
            permission: sylius_adyen.adyen_order_payment.generate
            group: sales

        sylius_adyen_admin_order_payment_reverse:
            permission: sylius_adyen.adyen_order_payment.reverse
            group: sales

        sylius_adyen_admin_order_payment_capture:
            permission: sylius_adyen.adyen_order_payment.capture
            group: sales

        sylius_mollie_admin_mollie_methods:
            permission: sylius_mollie.mollie_method.view
            group: configuration

        sylius_mollie_admin_test_api_keys:
            permission: sylius_mollie.mollie_method.execute
            group: configuration

        # Reordering payment methods in the list -- the same operation Sylius' own
        # `updatePositionsAction` maps to.
        sylius_mollie_admin_mollie_method_change_position:
            permission: sylius_mollie.mollie_method.update
            group: configuration

        sylius_mollie_admin_mollie_method_delete_logo:
            permission: sylius_mollie.mollie_method.delete
            group: configuration

        # "mollie_order_payment": same reasoning as Adyen's above, in the other direction.
        sylius_mollie_admin_payment_link_generate:
            permission: sylius_mollie.mollie_order_payment.generate
            group: sales

        sylius_mollie_admin_onboarding_wizard_status:
            permission: sylius_mollie.mollie_onboarding_wizard.view
            group: configuration

        sylius_mollie_admin_onboarding_wizard_completed:
            permission: sylius_mollie.mollie_onboarding_wizard.update
            group: configuration

        # Same subject as the already-auto-discovered `sylius_mollie.mollie_subscription.index`
        # and `.show` -- only these three transitions cannot be resolved automatically.
        sylius_mollie_admin_mollie_subscription_cancel:
            permission: sylius_mollie.mollie_subscription.cancel
            group: sales

        sylius_mollie_admin_mollie_subscription_pause:
            permission: sylius_mollie.mollie_subscription.pause
            group: sales

        sylius_mollie_admin_mollie_subscription_resume:
            permission: sylius_mollie.mollie_subscription.resume
            group: sales

        # Payum's own generic refund endpoint, wired in by sylius/refund-plugin. Same subject as
        # `sylius_refund_complete_refund_payment` below -- both act on a RefundPayment -- with its
        # own operation rather than folding into "complete": executing the refund against the
        # gateway and marking the resulting payment completed are two different moments.
        payum_refund_do:
            permission: sylius_refund.refund_payment.refund
            group: sales

        sylius_mollie_admin_order_payment_refund:
            permission: sylius_mollie.mollie_order_payment.refund
            group: sales

        # Both operate on a PaymentMethod (confirmed against sylius/paypal-plugin's own
        # DownloadPayoutsReportAction/EnableSellerAction, which look one up by {id} despite the
        # route and action names suggesting a standalone "payouts report" or "seller" resource) --
        # so both reuse Sylius' own `sylius.payment_method` subject rather than inventing a
        # PayPal-specific one that would render as an identical, indistinguishable second
        # "Payment method" row next to the real payment methods screen.
        sylius_paypal_admin_download_payouts_report:
            permission: sylius.payment_method.download
            group: sales

        sylius_paypal_admin_enable_seller:
            permission: sylius.payment_method.update
            group: configuration

        # "order_refund", not "refund": PermissionTree nests a subject under any sibling whose
        # name is its prefix followed by "_" (the same rule that puts "product taxon" under
        # "product"). "refund" would have swallowed the already-existing "refund_payment" as a
        # child, stripping its "Refund " prefix down to a bare "Payments" -- indistinguishable
        # from Sylius' own `sylius.payment` row.
        sylius_refund_order_refunds_list:
            permission: sylius_refund.order_refund.index
            group: sales

        sylius_refund_refund_units:
            permission: sylius_refund.order_refund.view
            group: sales

        # Same subject as the already-auto-discovered `sylius_refund.credit_memo.index`.
        sylius_refund_credit_memo_details:
            permission: sylius_refund.credit_memo.show
            group: sales

        sylius_refund_admin_credit_memo_download:
            permission: sylius_refund.credit_memo.download
            group: sales

        sylius_refund_complete_refund_payment:
            permission: sylius_refund.refund_payment.complete
            group: sales

        sylius_refund_admin_credit_memo_send:
            permission: sylius_refund.credit_memo.send
            group: sales

    # Deliberately excluded from the permission check. Listed rather than omitted so a coverage
    # check can tell a considered decision apart from an oversight.
    excluded_routes:
        - sylius_admin_login
        - sylius_admin_login_check
        - sylius_admin_logout
        - sylius_admin_request_password_reset
        - sylius_admin_render_reset_password_page
        - sylius_admin_password_reset
        - sylius_admin_render_password_reset
        # The API's own password reset. Marked PUBLIC_ACCESS by Sylius' access control, so
        # whoever calls it has no administrator to check a permission against.
        - sylius_api_admin_reset_password_post
        - sylius_api_admin_reset_password_patch
        # Issues the credentials every other API call needs. Asking it for a permission is a
        # closed loop.
        - sylius_api_admin_authentication_token
        # Open so a role missing one widget's permission lands somewhere after logging in
        # instead of a 403; the widgets on it are gated individually -- see
        # LIVE_COMPONENT_PERMISSIONS and config/app/twig_hooks/admin/dashboard.yaml.
        - sylius_admin_dashboard
