# The order screen's Actions dropdown, introduced in Sylius 2.1 -- see
# config/sylius_version_gate.php for why this file exists apart from
# config/app/twig_hooks/admin/actions.yaml, which gates the same three permissions on the flat
# hook Sylius 2.0 renders instead.
sylius_twig_hooks:
    hooks:
        'sylius_admin.order.show.content.header.title_block.actions.list':
            cancel:
                configuration:
                    permission: sylius.order.cancel
            resend_confirmation_email:
                configuration:
                    permission: sylius.order.resend_confirmation_email
            # `sylius_admin_order_history` is the order controller's `showAction`.
            history:
                configuration:
                    permission: sylius.order.show
