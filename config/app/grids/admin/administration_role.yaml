sylius_grid:
    grids:
        odiseo_rbac_admin_administration_role:
            driver:
                name: doctrine/orm
                options:
                    class: "%odiseo_rbac.model.administration_role.class%"
            fields:
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: ~
                createdAt:
                    type: datetime
                    label: sylius.ui.creation_date
                    sortable: ~
                    options:
                        format: d-m-Y H:i
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [name]
                    form_options:
                        type: !php/const Sylius\Component\Grid\Filter\StringFilter::TYPE_CONTAINS
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
