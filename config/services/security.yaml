services:
    odiseo_rbac.security.effective_permissions_provider:
        class: Odiseo\SyliusRbacPlugin\Security\EffectivePermissionsProvider

    Odiseo\SyliusRbacPlugin\Security\EffectivePermissionsProviderInterface: '@odiseo_rbac.security.effective_permissions_provider'

    odiseo_rbac.security.scope_resolver.unrestricted:
        class: Odiseo\SyliusRbacPlugin\Security\Scope\UnrestrictedScopeResolver

    Odiseo\SyliusRbacPlugin\Security\Scope\ScopeResolverInterface: '@odiseo_rbac.security.scope_resolver.unrestricted'

    odiseo_rbac.security.voter.permission:
        class: Odiseo\SyliusRbacPlugin\Security\Voter\PermissionVoter
        arguments:
            - '@odiseo_rbac.security.effective_permissions_provider'
            - '@Odiseo\SyliusRbacPlugin\Security\Scope\ScopeResolverInterface'
        tags:
            - { name: security.voter }

    odiseo_rbac.security.resource_authorization_checker:
        class: Odiseo\SyliusRbacPlugin\Security\ResourceAuthorizationChecker
        arguments:
            - '@security.authorization_checker'

    # Replaces Sylius' DisabledAuthorizationChecker, which always answers true.
    sylius.resource_controller.authorization_checker: '@odiseo_rbac.security.resource_authorization_checker'

    odiseo_rbac.security.listener.admin_route:
        class: Odiseo\SyliusRbacPlugin\Security\Http\AdminRouteAuthorizationListener
        arguments:
            - '@security.authorization_checker'
            - '%odiseo_rbac.route_identifiers%'
            - '%odiseo_rbac.excluded_routes%'
            - '@odiseo_rbac.permission.entity_autocomplete_resolver'
            - '%odiseo_rbac.deny_unprotected_admin_routes%'
            - '%sylius_admin.path_name%'
        tags:
            - { name: kernel.event_subscriber }
