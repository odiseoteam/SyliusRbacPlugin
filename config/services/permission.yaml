services:
    odiseo_rbac.permission.route_resolver:
        class: Odiseo\SyliusRbacPlugin\Permission\Discovery\RoutePermissionResolver

    odiseo_rbac.permission.discoverer.resource_route:
        class: Odiseo\SyliusRbacPlugin\Permission\Discovery\ResourceRoutePermissionDiscoverer
        arguments:
            - '@router'
            - '@odiseo_rbac.permission.route_resolver'
            - '%odiseo_rbac.handled_routes%'
            - '%sylius_admin.path_name%'

    odiseo_rbac.permission.discoverer.declared:
        class: Odiseo\SyliusRbacPlugin\Permission\Discovery\DeclaredPermissionDiscoverer
        arguments:
            - '%odiseo_rbac.declared_permissions%'

    odiseo_rbac.permission.discoverer.live_component:
        class: Odiseo\SyliusRbacPlugin\Permission\Discovery\LiveComponentPermissionDiscoverer
        arguments:
            - '%odiseo_rbac.live_components%'
            - '%odiseo_rbac.mapped_live_components%'

    odiseo_rbac.permission.discoverer:
        class: Odiseo\SyliusRbacPlugin\Permission\Discovery\ChainPermissionDiscoverer
        arguments:
            -
                - '@odiseo_rbac.permission.discoverer.resource_route'
                - '@odiseo_rbac.permission.discoverer.declared'
                - '@odiseo_rbac.permission.discoverer.live_component'

    odiseo_rbac.permission.registry_factory:
        class: Odiseo\SyliusRbacPlugin\Permission\PermissionRegistryFactory
        arguments:
            - '@odiseo_rbac.permission.discoverer'

    odiseo_rbac.permission.registry:
        class: Odiseo\SyliusRbacPlugin\Permission\PermissionRegistry
        factory: ['@odiseo_rbac.permission.registry_factory', 'createRegistry']

    Odiseo\SyliusRbacPlugin\Permission\PermissionRegistryInterface: '@odiseo_rbac.permission.registry'

    odiseo_rbac.command.debug_permissions:
        class: Odiseo\SyliusRbacPlugin\Command\DebugPermissionsCommand
        arguments:
            - '@odiseo_rbac.permission.discoverer'
        tags:
            - { name: console.command }

    odiseo_rbac.command.grant_access:
        class: Odiseo\SyliusRbacPlugin\Command\GrantAccessCommand
        arguments:
            - '@sylius.repository.admin_user'
            - '@odiseo_rbac.repository.administration_role'
            - '@odiseo_rbac.factory.administration_role'
            - '@sylius.repository.locale'
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: console.command }

    odiseo_rbac.permission.entity_autocomplete_resolver:
        class: Odiseo\SyliusRbacPlugin\Permission\EntityAutocompletePermissionResolver
        arguments:
            - '@sylius.resource_registry'
            - '%odiseo_rbac.entity_autocomplete_permissions%'

    Odiseo\SyliusRbacPlugin\Permission\EntityAutocompletePermissionResolverInterface: '@odiseo_rbac.permission.entity_autocomplete_resolver'

    odiseo_rbac.permission.live_component_resolver:
        class: Odiseo\SyliusRbacPlugin\Permission\LiveComponentPermissionResolver
        arguments:
            - '%odiseo_rbac.live_component_permissions%'

    Odiseo\SyliusRbacPlugin\Permission\LiveComponentPermissionResolverInterface: '@odiseo_rbac.permission.live_component_resolver'

    odiseo_rbac.permission.route_map:
        class: Odiseo\SyliusRbacPlugin\Permission\RoutePermissionMap
        arguments:
            - '@router'
            - '@odiseo_rbac.permission.route_resolver'
            - '%odiseo_rbac.route_identifiers%'
            - '%odiseo_rbac.excluded_routes%'

    Odiseo\SyliusRbacPlugin\Permission\RoutePermissionMapInterface: '@odiseo_rbac.permission.route_map'

    odiseo_rbac.permission.tree:
        class: Odiseo\SyliusRbacPlugin\Permission\PermissionTree
        arguments:
            - '@odiseo_rbac.permission.registry'
            - '@router'
            - '@odiseo_rbac.permission.route_resolver'
            - '@odiseo_rbac.menu.unfiltered_provider'
            - '@sylius.resource_registry'
            - '%odiseo_rbac.subject_parents%'

    Odiseo\SyliusRbacPlugin\Permission\PermissionTreeInterface: '@odiseo_rbac.permission.tree'

    odiseo_rbac.twig.permission_tree:
        class: Odiseo\SyliusRbacPlugin\Twig\PermissionTreeExtension
        arguments:
            - '@odiseo_rbac.permission.tree'
        tags:
            - { name: twig.extension }
